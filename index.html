<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Find Babe’s Honey &amp; Bee Line — Vancouver Island</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&family=Rye&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --bg: #171717;
      --band-blue: #4D7099;
      --band-blue-mid: #5B7FA6;
      --band-blue-deep: #3E5F84;
      --light: #F2F2F2;
      --ink: #171717;
      --white: #FFFFFF;
      --white-90: rgba(255,255,255,0.9);
      --white-70: rgba(255,255,255,0.7);
      --black: #000000;
      --pin-shop: #D4AF6A;
      --pin-retailer: #1A2E1C;
      --line-on-blue: rgba(255,255,255,0.22);
      --line-on-light: rgba(23,23,23,0.12);
      --muted-on-light: rgba(23,23,23,0.62);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Raleway, "Helvetica Neue", Arial, sans-serif;
      font-size: 15.5px;
      font-weight: 300;
      letter-spacing: 0.4px;
      color: var(--white-90);
      background: var(--bg);
      line-height: 1.45;
    }
    .app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 20px 16px;
      background:
        linear-gradient(165deg, rgba(77,112,153,0.92) 0%, rgba(91,127,166,0.88) 45%, rgba(62,95,132,0.94) 100%);
      background-color: var(--band-blue);
    }
    html.embed, html.embed body {
      background: var(--band-blue);
      height: 100%;
      overflow: hidden;
    }
    html.embed .app {
      max-width: none;
      height: 100%;
      min-height: 100%;
      padding: 10px 12px 8px;
    }
    html.embed .brand { padding: 0 2px 8px; }
    html.embed .brand .sub { display: none; }
    html.embed .brand h1 {
      font-family: Raleway, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      font-style: normal;
    }
    html.embed .layout { flex: 1; min-height: 0; height: auto; max-height: none; }
    html.embed #map { min-height: 0; }

    .brand { padding: 4px 2px 14px; }
    .brand h1 {
      font-family: Rye, "Rockwell", Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      margin: 0;
      line-height: 1.15;
      color: var(--white);
      letter-spacing: 0.5px;
    }
    .brand .sub {
      margin: 8px 0 0;
      color: var(--white-70);
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.4px;
    }
    .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .search { position: relative; }
    .search input {
      width: 100%;
      border: 1px solid var(--line-on-blue);
      background: rgba(255,255,255,0.12);
      color: var(--white);
      border-radius: 0;
      padding: 11px 14px 11px 40px;
      font: inherit;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.4px;
      outline: none;
    }
    .search input::placeholder { color: var(--white-70); }
    .search input:focus {
      border-color: var(--white);
      background: rgba(255,255,255,0.18);
    }
    .search svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--white-70);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--white-90);
      background: transparent;
      color: var(--white);
      border-radius: 2px;
      padding: 7px 12px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .chip:hover { background: rgba(255,255,255,0.12); }
    .chip.on {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }
    .layout {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 12px;
      flex: 1;
      min-height: 420px;
      height: min(70vh, 720px);
      max-height: min(70vh, 720px);
      align-items: stretch;
      overflow: hidden;
    }
    #map {
      height: 100%;
      min-height: 0;
      border-radius: 0;
      overflow: hidden;
      border: 1px solid var(--line-on-blue);
      background: #c5d0db;
    }
    .list-wrap {
      background: var(--light);
      border: 1px solid var(--line-on-blue);
      border-radius: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      color: var(--ink);
    }
    .list-head {
      padding: 12px 16px 10px;
      font-size: 0.72rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted-on-light);
      font-weight: 700;
      border-bottom: 1px solid var(--line-on-light);
      background: var(--light);
    }
    .list { overflow: auto; flex: 1; background: var(--light); }
    .row {
      display: block; width: 100%; text-align: left; border: 0;
      border-bottom: 1px solid var(--line-on-light);
      background: transparent; padding: 14px 16px; cursor: pointer;
      font: inherit; color: inherit;
    }
    .row:hover { background: #e8e8e8; }
    .row.active {
      background: #e0e0e0;
      box-shadow: inset 3px 0 0 var(--black);
    }
    .row .nm {
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      font-family: Raleway, sans-serif;
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--ink);
    }
    .badge {
      font-size: 0.62rem; letter-spacing: 1px; text-transform: uppercase;
      background: var(--black); color: var(--white); border-radius: 0;
      padding: 2px 7px; font-weight: 700;
    }
    .row .addr {
      color: var(--muted-on-light);
      font-size: 0.88rem;
      font-weight: 300;
      letter-spacing: 0.3px;
      margin-top: 3px;
      text-transform: none;
    }
    .prods { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .tag {
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.3px;
      background: transparent;
      border: 1px solid var(--line-on-light);
      border-radius: 0;
      padding: 2px 6px;
      color: var(--muted-on-light);
    }
    .empty {
      padding: 28px 16px;
      color: var(--muted-on-light);
      font-weight: 300;
    }
    .note {
      margin: 12px 4px 0;
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.4px;
      color: var(--white-70);
      text-align: center;
    }
    .leaflet-popup-content-wrapper {
      background: var(--light);
      color: var(--ink);
      border-radius: 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .leaflet-popup-tip { background: var(--light); }
    .leaflet-popup-content {
      margin: 12px 14px;
      font-family: Raleway, sans-serif;
      font-weight: 300;
      letter-spacing: 0.3px;
    }
    .pop h3 {
      font-family: Raleway, sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 4px;
      font-size: 0.95rem;
      color: var(--ink);
    }
    .pop .meta { font-size: 0.88rem; color: var(--muted-on-light); line-height: 1.4; }
    .pop a {
      display: inline-block;
      margin-top: 2px;
      background: var(--black);
      color: var(--white);
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 0;
    }
    .pop a:hover { background: #222; }
    .pin { width: 28px; height: 36px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4)); }
    .leaflet-container {
      font-family: Raleway, sans-serif;
      background: #c5d0db;
    }
    .leaflet-control-attribution { font-size: 10px !important; }
    .legend {
      background: rgba(242,242,242,0.95);
      padding: 7px 10px;
      border-radius: 0;
      border: 1px solid var(--line-on-light);
      font-family: Raleway, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--ink);
      line-height: 1.55;
    }
    .legend i {
      display: inline-block;
      width: 9px; height: 9px;
      border-radius: 50%;
      margin-right: 6px;
    }
    @media (max-width: 860px) {
      .app { padding: 12px; }
      .layout {
        grid-template-columns: 1fr;
        min-height: 0;
        height: auto;
        max-height: none;
      }
      #map { min-height: 42vh; height: 42vh; max-height: 420px; }
      .list-wrap { min-height: 260px; max-height: 48vh; }
      html.embed .layout { height: 100%; }
      html.embed #map { height: 46%; min-height: 180px; max-height: none; }
      html.embed .list-wrap { min-height: 0; max-height: none; flex: 1; }
    }
  </style>

["BLine-473-MER", "BLine-473-ERL", "BLine-473-CUR", "BLine-473-GNG"], "notes": ""}];
  </script>
  <script>
    document.documentElement.classList.add("embed");

    const CHIPS = [
      { id: "all", label: "All" },
      { id: "shops", label: "Our shops" },
      { id: "honey", label: "Honey" },
      { id: "beeline", label: "Bee Line" },
      { id: "Mermaid Tears", label: "Mermaid Tears" },
      { id: "Earl Grey", label: "Earl Grey" },
      { id: "Currantly Hip", label: "Currantly Hip" },
      { id: "Ginger Splash", label: "Ginger Splash" },
      { id: "Wildflower", label: "Wildflower" },
      { id: "Clover", label: "Clover" },
      { id: "Creamed", label: "Creamed" },
    ];

    let filter = "all";
    let query = "";
    let selected = null;
    const markers = {};

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    const pinSvg = (fill, stroke, dot) =>
      `<svg class="pin" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg"><path d="M14 1.5c7 0 12.5 5.4 12.5 12.2 0 8.6-10.4 19.6-12.1 21.4a.6.6 0 0 1-.8 0C12 33.3 1.5 22.3 1.5 13.7 1.5 6.9 7 1.5 14 1.5z" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/><circle cx="14" cy="14" r="4.2" fill="${dot}"/></svg>`;

    const shopIcon = L.divIcon({
      className: "",
      html: pinSvg("#D4AF6A", "#171717", "#F2F2F2"),
      iconSize: [28, 36],
      iconAnchor: [14, 36],
      popupAnchor: [0, -34],
    });
    const storeIcon = L.divIcon({
      className: "",
      html: pinSvg("#1A2E1C", "#0A120B", "#F2F2F2"),
      iconSize: [28, 36],
      iconAnchor: [14, 36],
      popupAnchor: [0, -34],
    });

    const map = L.map("map", { scrollWheelZoom: true });
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19,
      attribution: '&copy; Esri',
    }).addTo(map);
    map.setView([48.55, -123.45], 9);

    const legend = L.control({ position: "bottomleft" });
    legend.onAdd = function () {
      const d = L.DomUtil.create("div", "legend");
      d.innerHTML = '<i style="background:#D4AF6A"></i>Babe’s shop<br><i style="background:#1A2E1C"></i>Retailer';
      return d;
    };
    legend.addTo(map);

    const chipBox = document.getElementById("chips");
    CHIPS.forEach((c) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (c.id === "all" ? " on" : "");
      b.textContent = c.label;
      b.dataset.id = c.id;
      b.addEventListener("click", () => {
        filter = c.id;
        [...chipBox.children].forEach((el) => el.classList.toggle("on", el.dataset.id === filter));
        render(true);
      });
      chipBox.appendChild(b);
    });

    document.getElementById("q").addEventListener("input", (e) => {
      query = e.target.value.trim().toLowerCase();
      render(true);
    });

    function matches(st) {
      if (query) {
        const blob = `${st.name} ${st.city} ${st.address}`.toLowerCase();
        if (!blob.includes(query)) return false;
      }
      const products = st.products || [];
      if (filter === "all") return true;
      if (filter === "shops") return st.type === "shop";
      if (filter === "honey") return products.some((p) => /Wildflower|Clover|Creamed|^Bulk$/.test(p));
      if (filter === "beeline") return products.some((p) => /Bee Line|Mermaid|Earl Grey|Currantly|Ginger/.test(p));
      return products.some((p) => p.includes(filter));
    }

    function mapsUrl(st) {
      const dest = st.lat != null
        ? `${st.lat},${st.lng}`
        : encodeURIComponent(`${st.address}, ${st.city}, BC ${st.postal || ""} Canada`);
      return `https://www.google.com/maps/dir/?api=1&destination=${dest}`;
    }

    function popupHtml(st) {
      const hours = st.hours ? `<div class="meta">${esc(st.hours)}</div>` : "";
      const phone = st.phone ? `<div class="meta"><a href="tel:${esc(st.phone.replace(/[^0-9+]/g,""))}" style="background:none;color:#171717;padding:0;text-transform:none;letter-spacing:0.3px;font-weight:500">${esc(st.phone)}</a></div>` : "";
      const notes = st.notes ? `<div class="meta" style="margin-top:6px">${esc(st.notes)}</div>` : "";
      const badge = st.type === "shop" ? ` <span class="badge">Babe's shop</span>` : "";
      const prod = esc((st.products || []).join(" · "));
      const cityline = esc(`${st.city}${st.postal ? ", " + st.postal : ""}`);
      return `<div class="pop">
        <h3>${esc(st.name)}${badge}</h3>
        <div class="meta">${esc(st.address)}<br>${cityline}</div>
        ${hours}${phone}
        <div class="meta" style="margin-top:6px">${prod}</div>
        ${notes}
        <div style="margin-top:8px"><a href="${mapsUrl(st)}" target="_blank" rel="noopener">Directions</a></div>
      </div>`;
    }

    function render(fit) {
      const list = document.getElementById("list");
      list.innerHTML = "";
      Object.values(markers).forEach((m) => map.removeLayer(m));
      for (const k of Object.keys(markers)) delete markers[k];
      const shown = STORES.filter(matches);
      const mapped = [];
      shown.forEach((st) => {
        if (st.lat != null && st.lng != null) {
          const mk = L.marker([st.lat, st.lng], {
            icon: st.type === "shop" ? shopIcon : storeIcon,
            title: st.name,
            zIndexOffset: st.type === "shop" ? 1000 : 0,
          });
          mk.bindPopup(popupHtml(st), { maxWidth: 300 });
          mk.on("click", () => highlight(st.id, false));
          mk.addTo(map);
          markers[st.id] = mk;
          mapped.push(mk);
        }
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "row" + (selected === st.id ? " active" : "");
        btn.dataset.id = st.id;
        const extra = st.hours ? `<div class="addr">${esc(st.hours)}${st.phone ? " · " + esc(st.phone) : ""}</div>` : "";
        btn.innerHTML = `<div class="nm">${esc(st.name)}${st.type === "shop" ? ' <span class="badge">Babe\'s shop</span>' : ""}</div>
          <div class="addr">${esc(st.address)}, ${esc(st.city)}${st.postal ? " " + esc(st.postal) : ""}</div>
          ${extra}
          <div class="prods">${(st.products || []).map((p) => `<span class="tag">${esc(p)}</span>`).join("")}</div>`;
        btn.addEventListener("click", () => {
          highlight(st.id, true);
          const mk = markers[st.id];
          if (mk) {
            map.setView(mk.getLatLng(), Math.max(map.getZoom(), 14), { animate: true });
            mk.openPopup();
          }
        });
        list.appendChild(btn);
      });
      if (!shown.length) {
        list.innerHTML = `<div class="empty">No stores match that search. Try another city or clear the filters.</div>`;
      }
      document.getElementById("count").textContent = `${shown.length} place${shown.length === 1 ? "" : "s"}`;
      if (fit && mapped.length) {
        map.fitBounds(L.featureGroup(mapped).getBounds().pad(0.14), { maxZoom: 12 });
      } else if (fit) {
        map.setView([48.55, -123.45], 9);
      }
      setTimeout(() => map.invalidateSize(), 60);
    }

    function highlight(id, scrollList) {
      selected = id;
      document.querySelectorAll(".row").forEach((el) => el.classList.toggle("active", el.dataset.id === id));
      if (scrollList) {
        const el = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
        if (el) el.scrollIntoView({ block: "nearest" });
      }
    }

    render(true);
    window.addEventListener("resize", () => map.invalidateSize());
  </script>
</body>
</html>
