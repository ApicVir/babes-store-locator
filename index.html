<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Find Babe’s Honey &amp; Bee Line — Vancouver Island</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&family=Rye&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --bg: #171717;
      --band-blue: #4D7099;
      --band-blue-mid: #5B7FA6;
      --band-blue-deep: #3E5F84;
      --light: #F2F2F2;
      --ink: #171717;
      --white: #FFFFFF;
      --white-90: rgba(255,255,255,0.9);
      --white-70: rgba(255,255,255,0.7);
      --black: #000000;
      --pin-shop: #D4AF6A;
      --pin-retailer: #1A2E1C;
      --pin-cafe: #8B4513;
      --line-on-blue: rgba(255,255,255,0.22);
      --line-on-light: rgba(23,23,23,0.12);
      --muted-on-light: rgba(23,23,23,0.62);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Raleway, "Helvetica Neue", Arial, sans-serif;
      font-size: 15.5px;
      font-weight: 300;
      letter-spacing: 0.4px;
      color: var(--white-90);
      background: var(--bg);
      line-height: 1.45;
    }
    .app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 20px 16px;
      background:
        linear-gradient(165deg, rgba(77,112,153,0.92) 0%, rgba(91,127,166,0.88) 45%, rgba(62,95,132,0.94) 100%);
      background-color: var(--band-blue);
    }
    html.embed, html.embed body {
      background: var(--band-blue);
    }
    @media (min-width: 861px) {
      html.embed, html.embed body {
        height: 100%;
        overflow: hidden;
      }
    }
    html.embed .app {
      max-width: none;
      height: 100%;
      min-height: 100%;
      padding: 10px 12px 8px;
    }
    html.embed .brand { padding: 0 2px 8px; }
    html.embed .brand .sub { display: none; }
    html.embed .brand h1 {
      font-family: Raleway, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      font-style: normal;
    }
    html.embed .layout { flex: 1; min-height: 0; height: auto; max-height: none; }
    html.embed #map { min-height: 0; }

    .brand { padding: 4px 2px 14px; }
    .brand h1 {
      font-family: Rye, "Rockwell", Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      margin: 0;
      line-height: 1.15;
      color: var(--white);
      letter-spacing: 0.5px;
    }
    .brand .sub {
      margin: 8px 0 0;
      color: var(--white-70);
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.4px;
    }
    .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .search { position: relative; }
    .search input {
      width: 100%;
      border: 1px solid var(--line-on-blue);
      background: rgba(255,255,255,0.12);
      color: var(--white);
      border-radius: 0;
      padding: 11px 14px 11px 40px;
      font: inherit;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.4px;
      outline: none;
    }
    .search input::placeholder { color: var(--white-70); }
    .search input:focus {
      border-color: var(--white);
      background: rgba(255,255,255,0.18);
    }
    .search svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--white-70);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--white-90);
      background: transparent;
      color: var(--white);
      border-radius: 2px;
      padding: 7px 12px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .chip:hover { background: rgba(255,255,255,0.12); }
    .chip.on {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }
    .layout {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 12px;
      flex: 1;
      min-height: 420px;
      height: min(70vh, 720px);
      max-height: min(70vh, 720px);
      align-items: stretch;
      overflow: hidden;
    }
    #map {
      height: 100%;
      min-height: 0;
      border-radius: 0;
      overflow: hidden;
      border: 1px solid var(--line-on-blue);
      background: #c5d0db;
    }
    .list-wrap {
      background: var(--light);
      border: 1px solid var(--line-on-blue);
      border-radius: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      color: var(--ink);
    }
    .list-head {
      padding: 12px 16px 10px;
      font-size: 0.72rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted-on-light);
      font-weight: 700;
      border-bottom: 1px solid var(--line-on-light);
      background: var(--light);
    }
    .list { overflow: auto; flex: 1; background: var(--light); }
    .row {
      display: block; width: 100%; text-align: left; border: 0;
      border-bottom: 1px solid var(--line-on-light);
      background: transparent; padding: 14px 16px; cursor: pointer;
      font: inherit; color: inherit;
    }
    .row:hover { background: #e8e8e8; }
    .row.active {
      background: #e0e0e0;
      box-shadow: inset 3px 0 0 var(--black);
    }
    .row .nm {
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      font-family: Raleway, sans-serif;
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--ink);
    }
    .badge {
      font-size: 0.62rem; letter-spacing: 1px; text-transform: uppercase;
      background: var(--black); color: var(--white); border-radius: 0;
      padding: 2px 7px; font-weight: 700;
    }
    .row .addr {
      color: var(--muted-on-light);
      font-size: 0.88rem;
      font-weight: 300;
      letter-spacing: 0.3px;
      margin-top: 3px;
      text-transform: none;
    }
    .prods { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .tag {
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.3px;
      background: transparent;
      border: 1px solid var(--line-on-light);
      border-radius: 0;
      padding: 2px 6px;
      color: var(--muted-on-light);
    }
    .empty {
      padding: 28px 16px;
      color: var(--muted-on-light);
      font-weight: 300;
    }
    .note {
      margin: 12px 4px 0;
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.4px;
      color: var(--white-70);
      text-align: center;
    }
    .leaflet-popup-content-wrapper {
      background: var(--light);
      color: var(--ink);
      border-radius: 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .leaflet-popup-tip { background: var(--light); }
    .leaflet-popup-content {
      margin: 12px 14px;
      font-family: Raleway, sans-serif;
      font-weight: 300;
      letter-spacing: 0.3px;
    }
    .pop h3 {
      font-family: Raleway, sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 4px;
      font-size: 0.95rem;
      color: var(--ink);
    }
    .pop .meta { font-size: 0.88rem; color: var(--muted-on-light); line-height: 1.4; }
    .pop a {
      display: inline-block;
      margin-top: 2px;
      background: var(--black);
      color: var(--white);
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 0;
    }
    .pop a:hover { background: #222; }
    .pin { width: 28px; height: 36px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4)); }
    .leaflet-container {
      font-family: Raleway, sans-serif;
      background: #c5d0db;
    }
    .leaflet-control-attribution { font-size: 10px !important; }
    .babes-locate a {
      background: #000 !important;
      color: #fff !important;
      border-radius: 0 !important;
      width: 26px;
      height: 26px;
      line-height: 26px;
      display: flex !important;
      align-items: center;
      justify-content: center;
      border: 0 !important;
      font-size: 0;
    }
    .babes-locate a:hover { background: #222 !important; }
    .babes-locate a.busy { opacity: 0.65; }
    .you-pin {
      width: 14px; height: 14px;
      background: #000;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #000;
    }
    .row .km {
      margin-left: auto;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--ink);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .legend {
      background: rgba(242,242,242,0.95);
      padding: 7px 10px;
      border-radius: 0;
      border: 1px solid var(--line-on-light);
      font-family: Raleway, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--ink);
      line-height: 1.55;
    }
    .legend i {
      display: inline-block;
      width: 9px; height: 9px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .filters-toggle { display: none; }
    .mobile-tabs { display: none; }

    @media (max-width: 860px) {
      html, body {
        height: auto !important;
        overflow: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      .app {
        padding: 10px 10px 20px !important;
        height: auto !important;
        min-height: 100dvh;
        max-width: none !important;
      }
      .brand { padding: 2px 2px 8px !important; }
      .brand h1 { font-size: 0.9rem !important; }

      .toolbar { gap: 8px; margin-bottom: 8px; }
      .search input {
        font-size: 16px; /* prevent iOS zoom */
        padding: 12px 14px 12px 40px;
      }
      .mode-row { gap: 6px; }
      .mode {
        padding: 10px 12px;
        font-size: 0.72rem;
        min-height: 40px;
      }

      .filters-toggle {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        border: 1px solid var(--white-90);
        background: rgba(0,0,0,0.35);
        color: var(--white);
        padding: 12px 14px;
        font: inherit;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        border-radius: 0;
      }
      .filters-toggle .chev { transition: transform 0.15s ease; }
      .filters-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }

      .catalog {
        display: none;
        gap: 10px;
        margin-top: 8px;
      }
      .catalog.open { display: flex; }
      .hint { display: none; }
      .catalog.open + .hint,
      .catalog.open ~ .hint { display: block; }

      .cat-block { padding: 8px; }
      .product-row {
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
        scrollbar-width: thin;
      }
      .product-card {
        width: 72px;
        flex: 0 0 auto;
        padding: 8px 4px;
        min-height: 96px;
      }
      .product-card img { width: 52px; height: 52px; }
      .size-pill {
        padding: 10px 12px;
        min-height: 40px;
        font-size: 0.72rem;
      }
      .picked-chip {
        font-size: 0.68rem;
        padding: 8px 8px 8px 10px;
      }

      .mobile-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        margin: 0 0 8px;
        border: 1px solid var(--line-on-blue);
      }
      .mobile-tabs button {
        border: 0;
        background: rgba(0,0,0,0.25);
        color: var(--white-70);
        padding: 11px 8px;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
      }
      .mobile-tabs button.on {
        background: var(--black);
        color: var(--white);
      }

      .layout {
        display: block !important;
        height: auto !important;
        max-height: none !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
      #map {
        height: 52dvh !important;
        min-height: 280px !important;
        max-height: none !important;
        width: 100%;
      }
      .list-wrap {
        height: auto !important;
        min-height: 220px !important;
        max-height: none !important;
        margin-top: 8px;
      }
      .list { max-height: 50dvh; }

      /* Map / List tabs */
      body.mobile-show-list #map { display: none !important; }
      body.mobile-show-list .list-wrap {
        margin-top: 0;
        min-height: 60dvh !important;
      }
      body.mobile-show-list .list { max-height: none; }
      body.mobile-show-map .list-wrap { display: none !important; }

      .note { font-size: 0.75rem; margin-top: 10px; }
      .leaflet-control-zoom a {
        width: 36px !important;
        height: 36px !important;
        line-height: 36px !important;
        font-size: 18px !important;
      }
      .babes-locate a {
        width: 36px;
        height: 36px;
        line-height: 36px;
      }
    }


    .mode-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .mode {
      border: 1px solid var(--white-90);
      background: transparent;
      color: var(--white);
      border-radius: 2px;
      padding: 7px 12px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .mode:hover { background: rgba(255,255,255,0.12); }
    .mode.on { background: var(--black); color: var(--white); border-color: var(--black); }
    .catalog { display: flex; flex-direction: column; gap: 12px; }
    .cat-block {
      background: rgba(0,0,0,0.18);
      border: 1px solid var(--line-on-blue);
      padding: 10px 10px 8px;
    }
    .cat-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--white-70);
      margin: 0 0 8px 2px;
    }
    .product-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .product-card {
      width: 76px;
      border: 1px solid var(--line-on-blue);
      background: rgba(255,255,255,0.08);
      color: var(--white);
      padding: 6px 4px 7px;
      cursor: pointer;
      text-align: center;
      border-radius: 0;
      font: inherit;
    }
    .product-card:hover { background: rgba(255,255,255,0.16); }
    .product-card.on { background: var(--black); border-color: var(--black); }
    .product-card img {
      width: 56px; height: 56px; display: block; margin: 0 auto 5px; background: #F2F2F2;
      object-fit: cover;
    }
    .product-card .pname {
      display: block;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.2;
    }
    .size-row {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 8px; padding-top: 8px;
      border-top: 1px solid var(--line-on-blue);
    }
    .size-row[hidden] { display: none !important; }
    .size-pill {
      border: 1px solid var(--white-90);
      background: transparent;
      color: var(--white);
      border-radius: 2px;
      padding: 7px 11px;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .size-pill:hover { background: rgba(255,255,255,0.12); }
    .size-pill.on { background: var(--black); border-color: var(--black); }
    .active-filter {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--white-70);
      letter-spacing: 0.4px;
    }
    .active-filter strong { color: var(--white); font-weight: 600; }
    .active-filter button {
      margin-left: 8px; border: 0; background: transparent;
      color: var(--white); text-decoration: underline; cursor: pointer;
      font: inherit; font-size: 0.78rem;
    }

    .size-pill.picked {
      background: var(--black);
      border-color: var(--black);
    }
    .picked-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .picked-list[hidden] { display: none !important; }
    .picked-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--black);
      color: var(--white);
      border: 1px solid var(--black);
      padding: 6px 8px 6px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    .picked-chip button {
      border: 0;
      background: transparent;
      color: var(--white);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
    }
    .hint {
      margin: 4px 0 0;
      font-size: 0.72rem;
      color: var(--white-70);
      letter-spacing: 0.4px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="brand">
      <h1>Find Babe’s near you</h1>
      <p class="sub">Honey and Sparkling Bee Line on Vancouver Island &amp; the Gulf Islands.</p>
    </header>
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search store, city, or SKU…" autocomplete="off" />
      </div>
      <div class="mode-row" id="modes"></div>
      <button type="button" class="filters-toggle" id="filters-toggle" aria-expanded="false">
        <span id="filters-toggle-label">Shop products</span>
        <span class="chev" aria-hidden="true">▾</span>
      </button>
      <div class="catalog" id="catalog">
        <div class="cat-block" data-cat="honey">
          <div class="cat-label">Honey</div>
          <div class="product-row" id="honey-products"></div>
          <div class="size-row" id="honey-sizes" hidden></div>
        </div>
        <div class="cat-block" data-cat="beeline">
          <div class="cat-label">Sparkling Bee Line</div>
          <div class="product-row" id="beeline-products"></div>
          <div class="size-row" id="beeline-sizes" hidden></div>
        </div>
      </div>
      <p class="hint">Tap sizes to build a list — only stores with <em>all</em> of them show.</p>
      <div class="picked-list" id="picked-list" hidden></div>
      <div class="active-filter" id="active-filter" hidden></div>
    </div>
    <div class="mobile-tabs" id="mobile-tabs" role="tablist">
      <button type="button" class="on" data-tab="map">Map</button>
      <button type="button" data-tab="list">List</button>
    </div>
    <div class="layout">
      <div id="map" role="application" aria-label="Store map"></div>
      <aside class="list-wrap">
        <div class="list-head" id="count">Stores</div>
        <div class="list" id="list"></div>
      </aside>
    </div>
    <p class="note">Stock changes. Call the store if you need a specific size.</p>
  </div>

      const R = 6371, toRad = (d) => d * Math.PI / 180;

      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;

    function setMode(next) {
      mode = next;
      if (next !== "all") {
        // keep picked SKUs — shops/ontap further narrow
      }
      syncUI();
      render(true);
    }

    function openProductSizes(key) {
      openProduct = (openProduct === key) ? null : key;
      syncUI();
    }

    function toggleSku(id) {
      mode = "all";
      if (picked.has(id)) picked.delete(id);
      else picked.add(id);
      syncUI();
      render(true);
    }

    function clearPicked() {
      picked.clear();
      openProduct = null;
      mode = "all";
      syncUI();
      render(true);
    }

    function productHasPicked(key) {
      const ids = CATALOG[key].sizes.map((s) => s.id);
      return ids.some((id) => picked.has(id));
    }

    function syncUI() {
      [...modeBox.children].forEach((el) =>
        el.classList.toggle("on", el.dataset.id === mode && picked.size === 0)
      );
      document.querySelectorAll(".product-card").forEach((el) => {
        const on = el.dataset.key === openProduct || productHasPicked(el.dataset.key);
        el.classList.toggle("on", on);
      });

      const entry = openProduct ? CATALOG[openProduct] : null;
      honeySizes.hidden = !(entry && entry.cat === "honey");
      beeSizes.hidden = !(entry && entry.cat === "beeline");
      const sizeHost = entry ? (entry.cat === "honey" ? honeySizes : beeSizes) : null;
      if (entry && sizeHost) {
        sizeHost.innerHTML = "";
        entry.sizes.forEach((sz) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "size-pill" + (picked.has(sz.id) ? " picked" : "");
          b.textContent = (picked.has(sz.id) ? "✓ " : "") + sz.label;
          b.addEventListener("click", () => toggleSku(sz.id));
          sizeHost.appendChild(b);
        });
      }

      // shopping list chips
      if (picked.size) {
        pickedEl.hidden = false;
        pickedEl.innerHTML = "";
        [...picked].forEach((id) => {
          const chip = document.createElement("span");
          chip.className = "picked-chip";
          chip.innerHTML = esc(id) + ' <button type="button" aria-label="Remove">&times;</button>';
          chip.querySelector("button").onclick = () => toggleSku(id);
          pickedEl.appendChild(chip);
        });
      } else {
        pickedEl.hidden = true;
        pickedEl.innerHTML = "";
      }

      if (picked.size || mode === "ontap" || mode === "shops" || mode === "cafes") {
        activeEl.hidden = false;
        let label;
        if (picked.size) {
          label = picked.size + " SKU" + (picked.size === 1 ? "" : "s") + " (must have all)";
        } else if (mode === "shops") label = "Our shops";
        else if (mode === "cafes") label = "Cafés & restaurants";
        else label = "On Tap";
        activeEl.innerHTML = "Showing: <strong>" + label + '</strong> <button type="button" id="clear-filter">Clear</button>';
        document.getElementById("clear-filter").onclick = clearPicked;
      } else {
        activeEl.hidden = true;
        activeEl.innerHTML = "";
      }
    }

    MODES.forEach((m) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "mode" + (m.id === "all" ? " on" : "");
      b.textContent = m.label;
      b.dataset.id = m.id;
      b.addEventListener("click", () => setMode(m.id));
      modeBox.appendChild(b);
    });

    Object.entries(CATALOG).forEach(([key, entry]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "product-card";
      b.dataset.key = key;
      b.innerHTML = '<img src="' + entry.img + '" alt="" width="56" height="56" /><span class="pname">' + entry.name + "</span>";
      b.addEventListener("click", () => openProductSizes(key));
      (entry.cat === "honey" ? honeyBox : beeBox).appendChild(b);
    });

    document.getElementById("q").addEventListener("input", (e) => {
      query = e.target.value.trim().toLowerCase();
      render(true);
    });

    function matches(st) {
      const products = st.products || [];
      const codes = st.productCodes || [];
      if (query) {
        const blob = (
          st.searchText ||
          (st.name + " " + st.city + " " + st.address + " " + products.join(" ") + " " + codes.join(" "))
        ).toLowerCase();
        const tokens = query.split(/\s+/).filter(Boolean);
        if (!tokens.every((tok) => blob.includes(tok))) return false;
      }
      if (mode === "shops" && st.type !== "shop") return false;
      if (mode === "cafes" && st.type !== "cafe") return false;
      if (mode === "ontap" && !products.includes("On Tap")) return false;
      // AND: every picked SKU must be carried
      if (picked.size) {
        for (const sku of picked) {
          if (!products.includes(sku)) return false;
        }
      }
      return true;
    }

    function mapsUrl(st) {
      const dest = st.lat != null
        ? `${st.lat},${st.lng}`
        : encodeURIComponent(`${st.address}, ${st.city}, BC ${st.postal || ""} Canada`);
      return `https://www.google.com/maps/dir/?api=1&destination=${dest}`;
    }

    function popupHtml(st) {
      const hours = st.hours ? `<div class="meta">${esc(st.hours)}</div>` : "";
      const phone = st.phone ? `<div class="meta"><a href="tel:${esc(st.phone.replace(/[^0-9+]/g,""))}" style="background:none;color:#171717;padding:0;text-transform:none;letter-spacing:0.3px;font-weight:500">${esc(st.phone)}</a></div>` : "";
      const notes = st.notes ? `<div class="meta" style="margin-top:6px">${esc(st.notes)}</div>` : "";
      const badge = st.type === "shop" ? ` <span class="badge">Babe's shop</span>` : (st.type === "cafe" ? ` <span class="badge">Café</span>` : "");
      const prod = esc((st.products || []).join(" · "));
      const cityline = esc(`${st.city}${st.postal ? ", " + st.postal : ""}`);
      const km = formatDist(distKm(st));
      const distLine = km ? `<div class="meta">${esc(km)} away</div>` : "";
      return `<div class="pop">
        <h3>${esc(st.name)}${badge}</h3>
        <div class="meta">${esc(st.address)}<br>${cityline}</div>
        ${distLine}${hours}${phone}
        <div class="meta" style="margin-top:6px">${prod}</div>
        ${notes}
        <div style="margin-top:8px"><a href="${mapsUrl(st)}" target="_blank" rel="noopener">Directions</a></div>
      </div>`;
    }

    function render(fit) {
      const list = document.getElementById("list");
      list.innerHTML = "";
      Object.values(markers).forEach((m) => map.removeLayer(m));
      for (const k of Object.keys(markers)) delete markers[k];
      const shown = STORES.filter(matches);
      if (userLat != null && userLng != null) {
        shown.sort((a, b) => {
          const da = distKm(a), db = distKm(b);
          if (da == null && db == null) return 0;
          if (da == null) return 1;
          if (db == null) return -1;
          return da - db;
        });
      }
      const mapped = [];
      shown.forEach((st) => {
        if (st.lat != null && st.lng != null) {
          const mk = L.marker([st.lat, st.lng], {
            icon: st.type === "shop" ? shopIcon : (st.type === "cafe" ? cafeIcon : storeIcon),
            title: st.name,
            zIndexOffset: st.type === "shop" ? 1000 : 0,
          });
          mk.bindPopup(popupHtml(st), { maxWidth: 300 });
          mk.on("click", () => highlight(st.id, false));
          mk.addTo(map);
          markers[st.id] = mk;
          mapped.push(mk);
        }
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "row" + (selected === st.id ? " active" : "");
        btn.dataset.id = st.id;
        const extra = st.hours ? `<div class="addr">${esc(st.hours)}${st.phone ? " · " + esc(st.phone) : ""}</div>` : "";
        const km = formatDist(distKm(st));
        const kmEl = km ? `<span class="km">${esc(km)}</span>` : "";
        btn.innerHTML = `<div class="nm">${esc(st.name)}${st.type === "shop" ? ' <span class="badge">Babe\'s shop</span>' : (st.type === "cafe" ? ' <span class="badge">Café</span>' : "")}${kmEl}</div>
          <div class="addr">${esc(st.address)}, ${esc(st.city)}${st.postal ? " " + esc(st.postal) : ""}</div>
          ${extra}
          <div class="prods">${(st.products || []).map((p) => `<span class="tag">${esc(p)}</span>`).join("")}</div>`;
        btn.addEventListener("click", () => {
          highlight(st.id, true);
          const mk = markers[st.id];
          if (mk) {
            map.setView(mk.getLatLng(), Math.max(map.getZoom(), 14), { animate: true });
            mk.openPopup();
          }
        });
        list.appendChild(btn);
      });
      if (!shown.length) {
        list.innerHTML = `<div class="empty">No stores carry all of those. Clear a SKU or try fewer items.</div>`;
      }
      const near = (userLat != null && userLng != null) ? " · nearest first" : "";
      document.getElementById("count").textContent = `${shown.length} place${shown.length === 1 ? "" : "s"}${near}`;
      upsertUserMarker();
      if (userLat != null && userLng != null) {
        if (fit) map.setView([userLat, userLng], Math.max(map.getZoom() || 0, 12));
      } else if (fit && mapped.length) {
        map.fitBounds(L.featureGroup(mapped).getBounds().pad(0.14), { maxZoom: 12 });
      } else if (fit) {
        map.setView([48.55, -123.45], 9);
      }
      setTimeout(() => map.invalidateSize(), 60);
    }

    function highlight(id, scrollList) {
      selected = id;
      document.querySelectorAll(".row").forEach((el) => el.classList.toggle("active", el.dataset.id === id));
      if (scrollList) {
        const el = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
        if (el) el.scrollIntoView({ block: "nearest" });
      }
    }


    // Mobile: collapsible product shop + Map/List tabs
    const filtersToggle = document.getElementById("filters-toggle");
    const catalogEl = document.getElementById("catalog");
    const filtersLabel = document.getElementById("filters-toggle-label");
    if (filtersToggle && catalogEl) {
      filtersToggle.addEventListener("click", () => {
        const open = !catalogEl.classList.contains("open");
        catalogEl.classList.toggle("open", open);
        filtersToggle.setAttribute("aria-expanded", open ? "true" : "false");
        syncFilterToggleLabel();
        setTimeout(() => map.invalidateSize(), 80);
      });
    }
    function syncFilterToggleLabel() {
      if (!filtersLabel) return;
      if (picked.size) {
        filtersLabel.textContent = "Shop products · " + picked.size + " selected";
      } else {
        filtersLabel.textContent = catalogEl && catalogEl.classList.contains("open")
          ? "Hide products"
          : "Shop products";
      }
    }
    const _syncUI = syncUI;
    syncUI = function () {
      _syncUI();
      syncFilterToggleLabel();
    };

    const tabs = document.getElementById("mobile-tabs");
    if (tabs) {
      document.body.classList.add("mobile-show-map");
      tabs.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-tab]");
        if (!btn) return;
        const tab = btn.dataset.tab;
        tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === btn));
        document.body.classList.toggle("mobile-show-map", tab === "map");
        document.body.classList.toggle("mobile-show-list", tab === "list");
        setTimeout(() => map.invalidateSize(), 80);
      });
    }



    // Deep-link: ?sku=Wildflower%20500g%20jar&sku=Creamed%201kg%20jar (AND)
    // Location coords already applied from ?lat=&lng= above (no geolocation prompt).
    (function applyQuerySkus() {
      try {
        const params = new URLSearchParams(location.search);
        const list = [...params.getAll("sku"), ...(params.get("skus") || "").split(",")].map((s) => s.trim()).filter(Boolean);
        if (!list.length) return;
        list.forEach((id) => picked.add(id));
        // open first matching product panel
        for (const [key, entry] of Object.entries(CATALOG)) {
          if (entry.sizes.some((sz) => list.includes(sz.id))) { openProduct = key; break; }
        }
        mode = "all";
        if (catalogEl) {
          catalogEl.classList.add("open");
          if (filtersToggle) filtersToggle.setAttribute("aria-expanded", "true");
        }
      } catch (e) {}
    })();

    syncUI();
    render(true);
    window.addEventListener("resize", () => map.invalidateSize());

  </script>
</body>
</html>
